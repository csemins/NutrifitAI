org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- NutriFit AI runtime configuration (no secrets here) ----
# NutriFit AI server (AI proxy + private image bucket), exposed through the Cloudflare tunnel.
# The LLM key lives ONLY on the server. Debug builds can override it in-app (Profile > AI server).
nutrifit.aiBaseUrlDebug=https://nutrifitai.transformsai.org/
nutrifit.aiBaseUrlRelease=https://nutrifitai.transformsai.org/
# Realtime Database URL. Leave empty to auto-detect from google-services.json (firebase_url).
nutrifit.rtdbUrl=
