plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def aiDebug = project.findProperty('nutrifit.aiBaseUrlDebug') ?: 'https://nutrifitai.transformsai.org/'
def aiRelease = project.findProperty('nutrifit.aiBaseUrlRelease') ?: 'https://nutrifitai.transformsai.org/'
def rtdbUrl = project.findProperty('nutrifit.rtdbUrl') ?: ''
// Optional TURN relay for calls on networks that block direct connections (empty = direct + STUN only)
def turnUrl = project.findProperty('nutrifit.turnUrl') ?: ''
def turnUser = project.findProperty('nutrifit.turnUser') ?: ''
def turnPass = project.findProperty('nutrifit.turnPass') ?: ''
// CARTO basemaps API key for the walk map tiles (carto.com/basemaps). Kept in local.properties (git-ignored):
//   nutrifit.cartoKey=cb1_...
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { localProps.load(it) }
// Demo build: AI is open to every signed-in account (the server must run with AI_OPEN_TO_ALL=true too).
def aiOpen = (project.findProperty('nutrifit.aiOpen') ?: 'true').toString()
def cartoKey = (localProps.getProperty('nutrifit.cartoKey') ?: project.findProperty('nutrifit.cartoKey') ?: '').toString()
// Release signing: keystore.properties (git-ignored) next to settings.gradle. Without it the release build is unsigned.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.transformsai.nutrifitai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.transformsai.nutrifitai'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.2.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // phones (64/32-bit ARM) and x86_64 emulators/Chromebooks; 32-bit x86 is dropped to keep the APK smaller
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        buildConfigField 'String', 'RTDB_URL', "\"${rtdbUrl}\""
        buildConfigField 'String', 'TURN_URL', "\"${turnUrl}\""
        buildConfigField 'String', 'TURN_USER', "\"${turnUser}\""
        buildConfigField 'String', 'TURN_PASS', "\"${turnPass}\""
        buildConfigField 'String', 'CARTO_KEY', "\"${cartoKey}\""
        buildConfigField 'boolean', 'AI_OPEN', aiOpen

        javaCompileOptions {
            annotationProcessorOptions {
                // Room exports its schema so migrations can be reviewed and tested.
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString(),
                              'room.incremental'   : 'true']
            }
        }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'AI_BASE_URL', "\"${aiDebug}\""
            // Firebase Emulator Suite is opt-in at runtime from the debug-only developer menu.
            buildConfigField 'boolean', 'ALLOW_EMULATORS', 'true'
        }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
            buildConfigField 'String', 'AI_BASE_URL', "\"${aiRelease}\""
            buildConfigField 'boolean', 'ALLOW_EMULATORS', 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        // Exported Room schemas are packaged into instrumentation tests for MigrationTestHelper.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        warningsAsErrors false
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'OldTargetApi'
        xmlReport true
        htmlReport true
    }

    // MediaPipe memory-maps the .task pose models straight from the APK, so they must stay uncompressed.
    androidResources {
        noCompress += ['task']
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    // AndroidX UI
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Architecture
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'

    // Room (local source of truth)
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    // WorkManager (sync, AI analysis jobs)
    implementation 'androidx.work:work-runtime:2.10.3'

    // CameraX
    implementation 'androidx.camera:camera-core:1.5.1'
    implementation 'androidx.camera:camera-camera2:1.5.1'
    implementation 'androidx.camera:camera-lifecycle:1.5.1'
    implementation 'androidx.camera:camera-view:1.5.1'
    implementation 'androidx.camera:camera-video:1.5.1' // workout clips for the social feed
    implementation 'io.getstream:stream-webrtc-android:1.3.10' // video/voice calls (WebRTC, signalling over Firebase)
    implementation 'com.google.guava:guava:33.4.8-android' // ListenableFuture for CameraX

    // On-device pose estimation (BlazePose, 33 landmarks) for camera rep counting
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'

    // On-device barcode scanning (bundled model, works without Play services) for packaged foods
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // OpenStreetMap maps for GPS walk routes (map data © OpenStreetMap contributors, tiles © CARTO)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'

    // Google Sign-In through Credential Manager
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Networking, JSON, images
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Local JVM tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
    androidTestImplementation 'androidx.work:work-testing:2.10.3'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
